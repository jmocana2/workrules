version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: workrules-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Configuracion basica
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

      # Timezone
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid

      # Seguridad (cambiar en produccion)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # Persistencia
      - N8N_USER_FOLDER=/home/node/.n8n

      # Logs
      - N8N_LOG_LEVEL=info

      # Permitir leer $env.* dentro de nodos Code/HTTP (necesario para SUPABASE_URL,
      # WEBHOOK_PROGRESS_SECRET, etc.).
      # SECURITY: con esto, CUALQUIER nodo del workflow puede leer TODAS las env vars
      # del contenedor (incluidas N8N_BASIC_AUTH_PASSWORD y demás secretos). Solo es
      # aceptable porque (a) los workflows los escribimos nosotros, (b) el acceso al
      # editor está protegido por basic auth, y (c) no hay usuarios externos con
      # permisos de edicion. Si en algun momento se da acceso al editor a terceros,
      # hay que revisar este flag y considerar pasar los valores via credenciales
      # (Header Auth) en lugar de $env.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # Variables consumidas por los workflows
      - SUPABASE_URL=${SUPABASE_URL}

    volumes:
      # Persistir datos de n8n (workflows, credenciales, etc)
      - n8n_data:/home/node/.n8n
      # Montar carpeta local para importar/exportar workflows
      - ./workflows:/home/node/workflows

    # Permitir acceso a host.docker.internal (para conectar con Supabase local)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    driver: local
