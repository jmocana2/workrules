name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build app (vite only, sin storybook ni slides)
      run: pnpm exec vite build
      env:
        VITE_E2E_TESTING: "true"
        # En E2E la red va mockeada con page.route(); estos valores son
        # placeholders para que la app construya cuando los Secrets no estan
        # definidos. Si existen los secrets, prevalecen.
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://e2e.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'e2e-anon-key' }}
    - name: Run Playwright tests
      run: pnpm exec playwright test --project=chromium
      env:
        VITE_E2E_TESTING: "true"
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://e2e.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'e2e-anon-key' }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 7
