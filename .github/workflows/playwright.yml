name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Get Playwright version
      id: playwright-version
      run: |
        version=$(pnpm exec playwright --version | sed 's/Version //')
        if [ -z "$version" ]; then echo "Could not determine Playwright version" >&2; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
    - name: Install Playwright chromium browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      timeout-minutes: 5
      run: pnpm exec playwright install chromium
    - name: Install Playwright system deps
      timeout-minutes: 5
      env:
        DEBIAN_FRONTEND: noninteractive
      run: sudo -E pnpm exec playwright install-deps chromium
    - name: Build app
      run: pnpm build
      env:
        VITE_E2E_TESTING: "true"
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    - name: Run Playwright tests
      run: pnpm exec playwright test --project=chromium
      env:
        VITE_E2E_TESTING: "true"
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
